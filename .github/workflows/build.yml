name: build-worker
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (torch + CUDA wheels are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: "ghcr.io/${{ github.repository_owner }}/mj-upscaler-worker:latest,ghcr.io/${{ github.repository_owner }}/mj-upscaler-worker:${{ github.sha }}" }
