name: build-worker
on: { push: { branches: [main, "speed-*"] }, workflow_dispatch: {} }
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (torch + CUDA wheels are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # only main moves :latest; branch builds get just their commit tag (nothing live changes)
          tags: ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/mj-upscaler-worker:latest,ghcr.io/{0}/mj-upscaler-worker:{1}', github.repository_owner, github.sha) || format('ghcr.io/{0}/mj-upscaler-worker:{1}', github.repository_owner, github.sha) }}
